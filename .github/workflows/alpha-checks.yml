name: Alpha checks

on:
  push:
    branches: [3d-next]
  pull_request:
    branches: [3d-next]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: alpha-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: changes
        name: Select build inputs without skipping the final status
        run: python .github/scripts/alpha_changes.py
      - name: Check release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check suite versions
        run: python .github/scripts/release_version.py check
      - name: Review committed dependency notices (advisory)
        run: |
          if ! python .github/scripts/generate_notices.py check; then
            echo '::warning::Dependency notice check failed. Review and regenerate locally when needed; CI will use the checked-in notices.'
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: apps/holtburger-3d/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: apps/holtburger-3d
        run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check shared frontend and Electron logic once
        working-directory: apps/holtburger-3d
        run: |
          npm run check
          npm run lint:ts
          npm run test:ts
      - name: Check native branding generation
        working-directory: apps/holtburger-3d
        run: npm run check:branding
      - name: Test shared Rust libraries and shipped CLI behavior once
        run: |
          cargo test --locked -p holtburger-dat -p holtburger-content -p holtburger-core -p holtburger-cli -p holtburger-3d-host -p holtburger-weenie-catalog --lib
          cargo test --locked -p holtburger-cli --bin tui
          cargo test --locked -p holtburger-tools --lib dat2hba::tests::
          cargo test --locked -p holtburger-tools --bin dat2hba
      - name: Deny Rust lint warnings
        run: |
          cargo clippy --locked -p holtburger-dat -p holtburger-content -p holtburger-cli -p holtburger-3d-host -p holtburger-weenie-catalog --all-targets -- -D warnings
          cargo clippy --locked -p holtburger-debug-harness --bin content_bootstrap -- -D warnings

      - name: Exercise exhaustive theme and font behavior once
        working-directory: apps/holtburger-3d
        run: |
          npm run build
          npm run build:electron:main
          if ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb xauth
          fi
          xvfb-run --auto-servernum npm run probe:user-themes:built

  result:
    name: Alpha validation
    if: always()
    needs: [changes, quality]
    runs-on: ubuntu-22.04
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RELEVANT" = true ]; then
            test "$QUALITY_RESULT" = success
          else
            test "$QUALITY_RESULT" = skipped
          fi
