name: Alpha Release Candidate

on:
  workflow_dispatch:
  push:
    tags: ['alpha-[0-9]*']

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      linux_matrix: ${{ steps.identity.outputs.linux_matrix }}
      desktop_matrix: ${{ steps.identity.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Resolve one clean source identity and native matrix
        id: identity
        run: python .github/scripts/alpha_release.py plan
      - name: Check release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Review committed dependency notices (advisory)
        run: |
          if ! python .github/scripts/generate_notices.py check; then
            echo '::warning::Dependency notice check failed. Review and regenerate locally when needed; CI will use the checked-in notices.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-notices
          path: .github/licenses/THIRD_PARTY_NOTICES.html
          if-no-files-found: error
      - name: Create the manually requested candidate tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_TAG: ${{ steps.identity.outputs.tag }}
        run: python .github/scripts/alpha_release.py create-tag "$ALPHA_TAG"

  validation:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/3d-next'
    uses: ./.github/workflows/alpha-checks.yml

  linux:
    needs: plan
    uses: ./.github/workflows/alpha-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      matrix: ${{ needs.plan.outputs.linux_matrix }}

  desktop:
    needs: plan
    uses: ./.github/workflows/alpha-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}

  flatpak:
    needs: [plan, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_SOURCE_MODIFIED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: apps/holtburger-3d/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: verification-linux-electron
          path: apps/holtburger-3d/dist-electron
      - name: Install locked inspection and probe dependencies
        working-directory: apps/holtburger-3d
        # Package inspection uses @electron/asar; skip Electron's binary install and rebuilds.
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: alpha-notices
          path: .holtburger-local/alpha-notices
      - name: Fetch pinned standalone micro
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_alpha_content.py .holtburger-local/alpha-content
      - uses: actions/download-artifact@v4
        with:
          name: alpha-x86_64-unknown-linux-gnu
          path: .holtburger-local/alpha-native-linux
      - uses: actions/download-artifact@v4
        with:
          name: verification-linux-bootstrap
          path: .holtburger-local/alpha-linux-probes
      - name: Install Flatpak tooling and runtime
        run: |
          # GitHub's Ubuntu sources use this mirror list; retain the official archive/security entries.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
          sudo apt-get update
          # Keep builder helpers, SVG decoding and Xvfb authentication without optional media stacks.
          sudo apt-get install --yes --no-install-recommends \
            flatpak flatpak-builder appstream-compose desktop-file-utils elfutils ostree librsvg2-common \
            dbus-x11 xvfb xauth xdg-desktop-portal xdg-desktop-portal-gtk
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          RUNTIME_VERSION=$(python -c 'import json; print(json.load(open(".github/flatpak/io.github.merklejerk.holtburger-alpha.json"))["runtime-version"])')
          sudo flatpak install --noninteractive --assumeyes flathub "org.freedesktop.Platform/x86_64/$RUNTIME_VERSION" "org.freedesktop.Sdk/x86_64/$RUNTIME_VERSION"
      - name: Materialize the recipe from the verified Linux archive
        run: |
          SUITE=$(python .github/scripts/alpha_release.py prepare-suite-flatpak \
            --artifacts .holtburger-local/alpha-native-linux \
            --output .holtburger-local/alpha-suite-flatpak.json)
          echo "HOLTBURGER_FLATPAK_SUITE=$SUITE" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: holtburger-alpha.flatpak
          build-dir: .holtburger-local/flatpak-suite-build
          repo-dir: .holtburger-local/flatpak-suite-repo
          state-dir: .holtburger-local/flatpak-suite-state
          cache-key: alpha-suite-${{ runner.arch }}-${{ hashFiles('.github/flatpak/**', 'apps/holtburger-cli/dist/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/alpha-suite-flatpak.json
          cache: true
      - name: Verify installed bootstrap, tools, portals, private host, and renderer assets
        run: |
          flatpak install --user --noninteractive --assumeyes holtburger-alpha.flatpak
          chmod +x .holtburger-local/alpha-linux-probes/content_bootstrap
          # Portal services inherit their display from the D-Bus activation environment.
          xvfb-run --auto-servernum dbus-run-session -- \
            .github/flatpak/verify-installed \
            "$GITHUB_WORKSPACE/.holtburger-local/alpha-linux-probes/content_bootstrap"
      - name: Inspect installed bytes and stage the full-suite Flatpak
        run: |
          mkdir -p .holtburger-local/alpha-artifacts
          BUNDLE='.holtburger-local/alpha-artifacts/holtburger-alpha-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp holtburger-alpha.flatpak "$BUNDLE"
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-alpha)
          python .github/scripts/alpha_release.py record-suite-flatpak \
            --files "$LOCATION/files" --suite "$HOLTBURGER_FLATPAK_SUITE" \
            --bundle "$BUNDLE" \
            --output .holtburger-local/alpha-artifacts/metadata-holtburger-alpha-flatpak.json
      - name: Reuse inspected Linux inputs for the TUI recipe
        run: |
          mkdir -p target/release dats
          cp "$HOLTBURGER_FLATPAK_SUITE/holtburger-cli" target/release/holtburger-cli
          cp "$HOLTBURGER_FLATPAK_SUITE/dats/assets.hba" dats/assets.hba
      - name: Add alpha notices to the shared Flatpak recipe
        run: |
          python .github/scripts/alpha_release.py flatpak-manifest \
            --notices .holtburger-local/alpha-notices/THIRD_PARTY_NOTICES.html \
            --output .holtburger-local/alpha-flatpak.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: holtburger-cli.flatpak
          build-dir: .holtburger-local/flatpak-tui-build
          repo-dir: .holtburger-local/flatpak-tui-repo
          state-dir: .holtburger-local/flatpak-tui-state
          cache-key: alpha-tui-${{ runner.arch }}-${{ hashFiles('.github/flatpak/**', 'apps/holtburger-cli/dist/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/alpha-flatpak.json
          cache: true
      - name: Load production bootstrap inside the Flatpak runtime
        run: |
          flatpak install --user --noninteractive --assumeyes holtburger-cli.flatpak
          dbus-run-session -- flatpak run \
            --filesystem="$GITHUB_WORKSPACE/.holtburger-local/alpha-linux-probes:ro" \
            --command="$GITHUB_WORKSPACE/.holtburger-local/alpha-linux-probes/content_bootstrap" \
            io.github.merklejerk.holtburger-cli /app/share/holtburger/dats/assets.hba
          EXPECTED=$(sha256sum .holtburger-local/alpha-notices/THIRD_PARTY_NOTICES.html)
          ACTUAL=$(dbus-run-session -- flatpak run --command=sha256sum io.github.merklejerk.holtburger-cli /app/share/licenses/holtburger/THIRD_PARTY_NOTICES.html)
          test "${ACTUAL%% *}" = "${EXPECTED%% *}"
          EXPECTED=$(sha256sum "$HOLTBURGER_FLATPAK_SUITE/dats/assets.hba")
          ACTUAL=$(dbus-run-session -- flatpak run --command=sha256sum io.github.merklejerk.holtburger-cli /app/share/holtburger/dats/assets.hba)
          test "${ACTUAL%% *}" = "${EXPECTED%% *}"
      - name: Stage Flatpak and standalone micro
        run: |
          mkdir -p .holtburger-local/alpha-artifacts
          cp holtburger-cli.flatpak '.holtburger-local/alpha-artifacts/holtburger-cli-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp .holtburger-local/alpha-content/micro-hba.zip '.holtburger-local/alpha-artifacts/holtburger-micro-${{ needs.plan.outputs.version }}.zip'
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-cli)
          python .github/scripts/alpha_release.py record-tui-flatpak \
            --files "$LOCATION/files" \
            --bundle '.holtburger-local/alpha-artifacts/holtburger-cli-${{ needs.plan.outputs.version }}-x86_64.flatpak' \
            --output .holtburger-local/alpha-artifacts/metadata-holtburger-cli-flatpak.json
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-flatpaks
          path: .holtburger-local/alpha-artifacts/*
          if-no-files-found: error
          compression-level: 0

  stage:
    needs: [plan, validation, linux, desktop, flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_SOURCE_MODIFIED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: alpha-*
          path: .holtburger-local/alpha-artifacts
          merge-multiple: true
      - name: Stage the complete draft for final user native verification
        env:
          GH_TOKEN: ${{ github.token }}
          ALPHA_TAG: ${{ needs.plan.outputs.tag }}
        run: python .github/scripts/alpha_release.py stage .holtburger-local/alpha-artifacts "$ALPHA_TAG"
