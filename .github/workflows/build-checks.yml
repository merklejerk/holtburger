name: Build checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      product:
        type: string
        default: both
      commit:
        description: Immutable release source; ordinary PR/push runs use their event source
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-checks-${{ github.workflow }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      # A reusable release invocation always requests full validation.
      relevant: ${{ inputs.commit != '' || steps.changes.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - id: changes
        if: inputs.commit == ''
        name: Select build inputs without skipping the final status
        run: npm run check:changes
      - name: Check release tooling
        run: npm run check:tooling && npm run format:tooling:check && npm run test:tooling
      - name: Check suite versions
        run: npm run version:check
      - name: Check release PR version policy and scope
        run: npm run release:prepare -- check-pr
      - name: Review committed dependency notices (advisory)
        run: |
          if ! npm run check:notices; then
            echo '::warning::Dependency notice check failed. Review and regenerate locally when needed; CI will use the checked-in notices.'
          fi

  quality:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/holtburger-3d/package-lock.json
            apps/holtburger-cli/scripts/src/mage/package-lock.json
      - name: Install repository tooling
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Cache cleanup removes V8's native archive in target/debug/gn_out while
      # retaining build metadata. Rebuild V8 so its archive is downloaded again.
      - name: Rebuild V8 to restore its native library
        run: cargo clean --locked --package v8
      - name: Install frontend dependencies
        if: inputs.product != 'cli'
        working-directory: apps/holtburger-3d
        run: npm ci
      - name: Build and test TUI bundled scripts
        if: inputs.product != '3d'
        working-directory: apps/holtburger-cli/scripts/src/mage
        run: |
          npm ci
          npm run build
          npm test
      - name: Verify checked-in TUI script bundle
        if: inputs.product != '3d'
        run: git diff --exit-code -- apps/holtburger-cli/scripts/mage.js
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check shared frontend and Electron logic once
        if: inputs.product != 'cli'
        working-directory: apps/holtburger-3d
        run: |
          npm run check
          npm run lint:ts
          npm run test:ts
          npm run test:installers
      - name: Check native branding generation
        run: npm run check:branding
      - name: Test the complete Rust workspace
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Deny Rust lint warnings
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Exercise exhaustive theme and font behavior once
        if: inputs.product != 'cli'
        working-directory: apps/holtburger-3d
        run: |
          npm run build
          npm run build:electron:main
          if ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb xauth
          fi
          xvfb-run --auto-servernum npm run probe:user-themes:built

  result:
    name: Validation
    if: always()
    needs: [changes, quality]
    runs-on: ubuntu-22.04
    steps:
      - name: Require selected checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RELEVANT" = true ]; then
            test "$QUALITY_RESULT" = success
          else
            test "$QUALITY_RESULT" = skipped
          fi
