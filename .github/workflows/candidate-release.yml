name: Release Candidate

on:
  push:
    tags: ['candidate-[0-9]*']
  workflow_dispatch:
    inputs:
      purpose:
        description: Build a draft candidate or diagnostic artifacts (neither publishes)
        type: choice
        options: [candidate, diagnostic]
        default: candidate
      product:
        description: Product selection (candidates require both)
        type: choice
        options: [both, cli, 3d]
        default: both
      target:
        description: Native target selection (candidates require all)
        type: choice
        options: [all, x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin]
        default: all
      version:
        description: Explicit greater suite SemVer (candidate only; retries reuse it)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: candidate-allocation
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      product: ${{ steps.identity.outputs.product }}
      linux_enabled: ${{ steps.identity.outputs.linux_enabled }}
      desktop_enabled: ${{ steps.identity.outputs.desktop_enabled }}
      linux_matrix: ${{ steps.identity.outputs.linux_matrix }}
      desktop_matrix: ${{ steps.identity.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Allocation atomically pushes its version commit and tag; checkout removes credentials on cleanup.
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release tooling dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Prepare the locked dependency cache for offline version allocation
        if: github.event_name == 'workflow_dispatch' && inputs.purpose == 'candidate'
        run: cargo fetch --locked
      - name: Resolve source identity and selected native matrix
        id: identity
        env:
          REQUEST_PURPOSE: ${{ inputs.purpose || 'candidate' }}
          REQUEST_PRODUCT: ${{ inputs.product || 'both' }}
          REQUEST_TARGET: ${{ inputs.target || 'all' }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: python .github/scripts/candidate_release.py plan --purpose "$REQUEST_PURPOSE" --product "$REQUEST_PRODUCT" --target "$REQUEST_TARGET" --version "$REQUEST_VERSION"
      - name: Check release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Review committed dependency notices (advisory)
        run: |
          if ! python .github/scripts/generate_notices.py check; then
            echo '::warning::Dependency notice check failed. Review and regenerate locally when needed; CI will use the checked-in notices.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-notices
          path: .github/licenses/THIRD_PARTY_NOTICES.html
          if-no-files-found: error
  validation:
    needs: plan
    uses: ./.github/workflows/candidate-checks.yml
    with:
      product: ${{ needs.plan.outputs.product }}
      commit: ${{ needs.plan.outputs.commit }}

  linux:
    needs: plan
    if: needs.plan.outputs.linux_enabled == 'true'
    uses: ./.github/workflows/candidate-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      matrix: ${{ needs.plan.outputs.linux_matrix }}
      product: ${{ needs.plan.outputs.product }}

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop_enabled == 'true'
    uses: ./.github/workflows/candidate-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}
      product: ${{ needs.plan.outputs.product }}

  flatpak:
    needs: [plan, linux]
    if: needs.plan.outputs.linux_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_SOURCE_MODIFIED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release tooling dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.product != 'cli'
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: apps/holtburger-3d/package-lock.json
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.product != 'cli'
        with:
          name: verification-linux-electron
          path: apps/holtburger-3d/dist-electron
      - name: Install locked 3D inspection and probe dependencies
        if: needs.plan.outputs.product != 'cli'
        working-directory: apps/holtburger-3d
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*-x86_64-unknown-linux-gnu
          path: .holtburger-local/candidate-native-linux
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.product != '3d'
        with:
          name: verification-linux-bootstrap
          path: .holtburger-local/candidate-linux-probes
      - name: Install Flatpak tooling and shared runtime
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            flatpak flatpak-builder appstream-compose desktop-file-utils elfutils ostree librsvg2-common dbus-x11
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          RUNTIME_VERSION=$(python -c 'import json; print(json.load(open(".github/flatpak/io.github.merklejerk.holtburger-alpha.json"))["runtime-version"])')
          sudo flatpak install --noninteractive --assumeyes flathub "org.freedesktop.Platform/x86_64/$RUNTIME_VERSION" "org.freedesktop.Sdk/x86_64/$RUNTIME_VERSION"
      - name: Install 3D probe display and portal helpers
        if: needs.plan.outputs.product != 'cli'
        run: sudo apt-get install --yes --no-install-recommends xvfb xauth xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Materialize CLI recipe from its native archive
        if: needs.plan.outputs.product != '3d'
        run: |
          NATIVE=$(python .github/scripts/candidate_release.py prepare-flatpak --product cli \
            --artifacts .holtburger-local/candidate-native-linux --output .holtburger-local/candidate-cli-flatpak.json)
          echo "HOLTBURGER_CLI_NATIVE=$NATIVE" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: needs.plan.outputs.product != '3d'
        with:
          bundle: holtburger-cli.flatpak
          build-dir: .holtburger-local/flatpak-cli-build
          repo-dir: .holtburger-local/flatpak-cli-repo
          state-dir: .holtburger-local/flatpak-cli-state
          cache-key: candidate-cli-${{ runner.arch }}-${{ hashFiles('apps/holtburger-cli/dist/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/candidate-cli-flatpak.json
          cache: true
      - name: Probe and record CLI Flatpak
        if: needs.plan.outputs.product != '3d'
        run: |
          flatpak install --user --noninteractive --assumeyes holtburger-cli.flatpak
          chmod +x .holtburger-local/candidate-linux-probes/content_bootstrap
          dbus-run-session -- .github/flatpak/verify-cli-installed "$GITHUB_WORKSPACE/.holtburger-local/candidate-linux-probes/content_bootstrap"
          mkdir -p .holtburger-local/candidate-artifacts/cli
          BUNDLE='.holtburger-local/candidate-artifacts/cli/holtburger-cli-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp holtburger-cli.flatpak "$BUNDLE"
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-cli-alpha)
          python .github/scripts/candidate_release.py record-flatpak --files "$LOCATION/files" \
            --native "$HOLTBURGER_CLI_NATIVE" --bundle "$BUNDLE" \
            --output .holtburger-local/candidate-artifacts/cli/metadata-cli-flatpak.json
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.product != '3d'
        with:
          name: candidate-cli-flatpak
          path: .holtburger-local/candidate-artifacts/cli/*
          if-no-files-found: error
          compression-level: 0
      - name: Materialize 3D recipe from its native archive
        if: needs.plan.outputs.product != 'cli'
        run: |
          NATIVE=$(python .github/scripts/candidate_release.py prepare-flatpak --product 3d \
            --artifacts .holtburger-local/candidate-native-linux --output .holtburger-local/candidate-3d-flatpak.json)
          echo "HOLTBURGER_3D_NATIVE=$NATIVE" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: needs.plan.outputs.product != 'cli'
        with:
          bundle: holtburger-3d.flatpak
          build-dir: .holtburger-local/flatpak-3d-build
          repo-dir: .holtburger-local/flatpak-3d-repo
          state-dir: .holtburger-local/flatpak-3d-state
          cache-key: candidate-3d-${{ runner.arch }}-${{ hashFiles('.github/flatpak/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/candidate-3d-flatpak.json
          cache: true
      - name: Probe and record 3D Flatpak
        if: needs.plan.outputs.product != 'cli'
        run: |
          flatpak install --user --noninteractive --assumeyes holtburger-3d.flatpak
          xvfb-run --auto-servernum dbus-run-session -- .github/flatpak/verify-installed
          mkdir -p .holtburger-local/candidate-artifacts/3d
          BUNDLE='.holtburger-local/candidate-artifacts/3d/holtburger-3d-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp holtburger-3d.flatpak "$BUNDLE"
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-alpha)
          python .github/scripts/candidate_release.py record-flatpak --files "$LOCATION/files" \
            --native "$HOLTBURGER_3D_NATIVE" --bundle "$BUNDLE" \
            --output .holtburger-local/candidate-artifacts/3d/metadata-3d-flatpak.json
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.product != 'cli'
        with:
          name: candidate-3d-flatpak
          path: .holtburger-local/candidate-artifacts/3d/*
          if-no-files-found: error
          compression-level: 0

  stage:
    needs: [plan, validation, linux, desktop, flatpak]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_SOURCE_MODIFIED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release tooling dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: .holtburger-local/candidate-artifacts
          merge-multiple: true
      - name: Stage the complete draft for final user native verification
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.plan.outputs.tag }}
        run: python .github/scripts/candidate_release.py stage .holtburger-local/candidate-artifacts "$CANDIDATE_TAG"
