name: Nightly Build

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  HOLTBURGER_SOURCE_REVISION: ${{ github.sha }}
  HOLTBURGER_SOURCE_MODIFIED: '0'

jobs:
  tag:
    name: Create Nightly Tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Update Nightly Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

  dist-build:
    name: Build CLI binaries
    needs: tag
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build shipped CLI executables
        run: cargo build --locked --release --target '${{ matrix.target }}' -p holtburger-cli --bin tui -p holtburger-tools --bin dat2hba --bin dat-tool
      - name: Fetch pinned CLI content
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_cli_content.py .holtburger-local/cli-content
      - name: Assemble CLI bundle
        run: |
          python .github/scripts/alpha_release.py assemble --product cli \
            --target '${{ matrix.target }}' --content .holtburger-local/cli-content \
            --notices .github/licenses/THIRD_PARTY_NOTICES.html \
            --output .holtburger-local/nightly-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: .holtburger-local/nightly-artifacts/*
          if-no-files-found: error
          compression-level: 0

  flatpak-build:
    name: Package CLI Flatpak from Linux output
    needs: dist-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: .holtburger-local/nightly-linux
      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder appstream-compose desktop-file-utils elfutils ostree librsvg2-common
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          RUNTIME_VERSION=$(python -c 'import json; print(json.load(open(".github/flatpak/io.github.merklejerk.holtburger-alpha.json"))["runtime-version"])')
          sudo flatpak install --noninteractive --assumeyes flathub "org.freedesktop.Platform/x86_64/$RUNTIME_VERSION" "org.freedesktop.Sdk/x86_64/$RUNTIME_VERSION"
      - name: Materialize recipe from the native CLI archive
        run: |
          python .github/scripts/alpha_release.py prepare-flatpak --product cli \
            --artifacts .holtburger-local/nightly-linux --output .holtburger-local/nightly-flatpak.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: holtburger-cli.flatpak
          manifest-path: .holtburger-local/nightly-flatpak.json
          cache: true
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: holtburger-cli.flatpak
          if-no-files-found: error

  publish:
    name: Publish Nightly Release
    needs: [dist-build, flatpak-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.flatpak
          prerelease: true
          name: Holtburger CLI Nightly
          body: |
            This automated CLI build includes the terminal client, archive utilities,
            bundled scripts, and prepared navigation content. These builds are experimental.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
