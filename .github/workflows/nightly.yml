name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM daily
  workflow_dispatch: # Manual trigger for the rizz

permissions:
  contents: write

jobs:
  tag:
    name: Create Nightly Tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update Nightly Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

  data-release:
    name: Upload HBA Data
    needs: tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Fetch HBA files
        run: |
          curl -L ${{ vars.HBA_LATEST_URL }} -o hba.zip
      - name: Upload HBA Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: hba.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dist:
    name: Build & Release
    needs: tag
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build Workspace
        shell: bash
        run: cargo build --release --workspace

      - name: Fetch HBA files
        shell: bash
        run: |
          mkdir -p dats
          curl -L ${{ vars.HBA_LATEST_URL }} -o hba.zip
          unzip hba.zip -d dats
          rm hba.zip

      - name: Prepare Release Bundle
        shell: bash
        run: |
          # Create staging directory
          mkdir -p staging/dats
          
          # Detect binary extension (for Windows)
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          
          # Copy binaries and rename 'tui' to 'holtburger-cli'
          cp target/release/tui$EXT staging/holtburger-cli$EXT
          cp target/release/dat2hba$EXT staging/dat2hba$EXT
          cp target/release/dat-tool$EXT staging/dat-tool$EXT || true
          
          # Copy data files
          cp dats/*.hba staging/dats/
          
          # Archive the staging folder
          STAMP=$(date +'%Y%m%d')
          ARCHIVE_NAME="holtburger-nightly-${{ matrix.target }}"
          
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a "$ARCHIVE_NAME.zip" ./staging/*
            echo "ASSET_PATH=$ARCHIVE_NAME.zip" >> $GITHUB_ENV
          else
            tar -czf "$ARCHIVE_NAME.tar.gz" -C staging .
            echo "ASSET_PATH=$ARCHIVE_NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: ${{ env.ASSET_PATH }}
          prerelease: true
          name: "Nightly Build (Live on the edge 🍔)"
          body: |
            This is an automated nightly build of the Holtburger TUI client.
            Built on: ${{ github.event.repository.updated_at }}
            Commit: ${{ github.sha }}
            
            **Warning:** These builds are highly experimental!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    name: Build Flatpak
    needs: tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Pre-install the runtimes system-wide so the builder doesn't have to
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/24.08 org.freedesktop.Sdk/x86_64/24.08

      - name: Build TUI Client
        run: |
          cargo build --release --package holtburger-cli
          # Rename the binary from 'tui' to 'holtburger-cli' for official releases
          mv target/release/tui target/release/holtburger-cli

      - name: Fetch HBA files
        run: |
          mkdir -p dats
          curl -L ${{ vars.HBA_LATEST_URL }} -o hba.zip
          unzip hba.zip -d dats
          rm hba.zip

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: holtburger-cli.flatpak
          manifest-path: apps/holtburger-cli/dist/io.github.merklejerk.holtburger-cli.yaml
          cache: true
      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: holtburger-cli.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
