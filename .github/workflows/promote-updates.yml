name: Publish Website and Update Feeds

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release/quickstarts/**'
      - 'crates/holtburger-scripting/holtburger.d.ts'
      - 'assets/branding/**'
      - 'assets/screenshots/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/promote-updates.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feed-promotion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Release events identify data; publication always executes trusted main.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install repository tooling
        run: npm ci
      - name: Build and check website
        working-directory: site
        run: npm ci && npm run format:check && npm run check && npm run build && npm run check:links
      - name: Generate update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run --silent feeds:generate -- site/build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build
      - name: Deploy website and update feeds
        id: deployment
        uses: actions/deploy-pages@v5
