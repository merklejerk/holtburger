name: Publish Website and Update Feeds

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'release/quickstarts/**'
      - 'crates/holtburger-scripting/holtburger.d.ts'
      - 'assets/branding/**'
      - 'assets/screenshots/**'
      - 'apps/holtburger-3d/public/fonts/**'
      - 'apps/holtburger-3d/src/assets/icons/travelers-kit-*.svg'
      - '.github/scripts/**'
      - '.github/workflows/promote-updates.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-feed-promotion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Release events identify data; publication always executes trusted main.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and check website
        working-directory: site
        run: npm ci && npm run format:check && npm run check && npm run build && npm run check:links
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install -r .github/scripts/requirements.txt
          python .github/scripts/promote_updates.py site/build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build
      - name: Deploy website and update feeds
        id: deployment
        uses: actions/deploy-pages@v4
