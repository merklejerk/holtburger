name: Publish Website and Update Feeds

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/branding/**'
      - 'assets/screenshots/**'
      - 'apps/holtburger-3d/public/fonts/**'
      - 'apps/holtburger-3d/src/assets/icons/travelers-kit-*.svg'
      - '.github/scripts/**'
      - '.github/workflows/promote-updates.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Each run discovers the complete current inventory. Coalesced pending events are harmless.
concurrency:
  group: update-feed-promotion
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # Publication identifies data, not executable tooling. Checkout resolves this trusted ref to one SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release tooling dependencies
        run: python -m pip install -r .github/scripts/requirements.txt
      - name: Check feed publication
        run: python -m unittest discover -s .github/scripts -p 'test_promote_updates.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website dependencies
        run: npm ci
        working-directory: site
      - name: Check website formatting and types
        run: npm run format:check && npm run check
        working-directory: site
      - name: Build and validate website
        run: npm run build && npm run check:links
        working-directory: site
      - name: Reconcile accepted published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/promote_updates.py site/build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    needs: generate
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website and update feeds
        id: deployment
        uses: actions/deploy-pages@v4
