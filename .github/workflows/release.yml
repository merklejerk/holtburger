name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      purpose:
        description: Publish the current main version, publish a nightly, or build diagnostics
        type: choice
        options: [release, nightly, diagnostic]
        default: diagnostic
      product:
        description: Product selection (release/nightly require both)
        type: choice
        options: [both, cli, 3d]
        default: both
      target:
        description: Native targets (release/nightly require all)
        type: choice
        options:
          [
            all,
            x86_64-unknown-linux-gnu,
            x86_64-pc-windows-msvc,
            aarch64-apple-darwin,
          ]
        default: all
  workflow_call:
    inputs:
      purpose:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: suite-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/prepare-'))
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      kind: ${{ steps.identity.outputs.kind }}
      skip: ${{ steps.identity.outputs.skip }}
      commit: ${{ steps.identity.outputs.commit }}
      product: ${{ steps.identity.outputs.product }}
      linux_enabled: ${{ steps.identity.outputs.linux_enabled }}
      desktop_enabled: ${{ steps.identity.outputs.desktop_enabled }}
      linux_matrix: ${{ steps.identity.outputs.linux_matrix }}
      desktop_matrix: ${{ steps.identity.outputs.desktop_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Resolve source identity and selected native matrix
        id: identity
        env:
          REQUEST_PURPOSE: ${{ inputs.purpose || 'release' }}
          REQUEST_PRODUCT: ${{ inputs.product || 'both' }}
          REQUEST_TARGET: ${{ inputs.target || 'all' }}
          GH_TOKEN: ${{ github.token }}
        run: npm run --silent release -- plan --purpose "$REQUEST_PURPOSE" --product "$REQUEST_PRODUCT" --target "$REQUEST_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notices
          path: .github/licenses/THIRD_PARTY_NOTICES.html
          if-no-files-found: error
  validation:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    uses: ./.github/workflows/build-checks.yml
    with:
      product: ${{ needs.plan.outputs.product }}
      commit: ${{ needs.plan.outputs.commit }}

  linux:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.linux_enabled == 'true'
    uses: ./.github/workflows/release-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      kind: ${{ needs.plan.outputs.kind }}
      matrix: ${{ needs.plan.outputs.linux_matrix }}
      product: ${{ needs.plan.outputs.product }}

  desktop:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.desktop_enabled == 'true'
    uses: ./.github/workflows/release-native.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      kind: ${{ needs.plan.outputs.kind }}
      matrix: ${{ needs.plan.outputs.desktop_matrix }}
      product: ${{ needs.plan.outputs.product }}

  flatpak:
    needs: [plan, linux]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.linux_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_DISTRIBUTION: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        if: needs.plan.outputs.kind == 'nightly'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.plan.outputs.kind == 'nightly'
        with:
          cache-targets: false
          shared-key: release-versioning-registry
      - name: Validate and prepare distribution versions
        run: |
          if [ "$HOLTBURGER_DISTRIBUTION" = nightly ]; then cargo fetch --locked; fi
          npm run --silent release -- prepare-source --kind "$HOLTBURGER_DISTRIBUTION"
          echo 'HOLTBURGER_SOURCE_MODIFIED=0' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.product != 'cli'
        with:
          name: verification-linux-electron
          path: apps/holtburger-3d/dist-electron
      - name: Install locked 3D inspection and probe dependencies
        if: needs.plan.outputs.product != 'cli'
        working-directory: apps/holtburger-3d
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-x86_64-unknown-linux-gnu
          path: .holtburger-local/release-native-linux
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.product != '3d'
        with:
          name: verification-linux-bootstrap
          path: .holtburger-local/release-linux-probes
      - name: Refresh Ubuntu package indexes
        timeout-minutes: 5
        run: |
          # Bound network stalls for this refresh and subsequent package installs.
          # Keep the runner's default mirror selection instead of excluding a mirror.
          sudo tee /etc/apt/apt.conf.d/99-holtburger-ci > /dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT::Update::Error-Mode "any";
          EOF
          sudo apt-get update
      - name: Install Ubuntu Flatpak tooling
        timeout-minutes: 10
        run: |
          sudo apt-get install --yes --no-install-recommends \
            flatpak flatpak-builder appstream-compose desktop-file-utils elfutils ostree librsvg2-common dbus-x11
      - name: Download shared Flatpak runtime and SDK from Flathub
        timeout-minutes: 15
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          RUNTIME_VERSION=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; console.log(JSON.parse(readFileSync(".github/flatpak/io.github.merklejerk.holtburger-3d.json", "utf8"))["runtime-version"])')
          sudo flatpak install --noninteractive --assumeyes flathub "org.freedesktop.Platform/x86_64/$RUNTIME_VERSION" "org.freedesktop.Sdk/x86_64/$RUNTIME_VERSION"
      - name: Install 3D probe display and portal helpers
        if: needs.plan.outputs.product != 'cli'
        timeout-minutes: 5
        run: sudo apt-get install --yes --no-install-recommends xvfb xauth xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Materialize CLI recipe from its native archive
        if: needs.plan.outputs.product != '3d'
        run: |
          NATIVE=$(npm run --silent release -- prepare-flatpak --product cli \
            --artifacts .holtburger-local/release-native-linux --output .holtburger-local/release-cli-flatpak.json)
          echo "HOLTBURGER_CLI_NATIVE=$NATIVE" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: needs.plan.outputs.product != '3d'
        with:
          bundle: .holtburger-local/holtburger-cli.flatpak
          build-dir: .holtburger-local/flatpak-cli-build
          repo-dir: .holtburger-local/flatpak-cli-repo
          state-dir: .holtburger-local/flatpak-cli-state
          cache-key: release-cli-${{ runner.arch }}-${{ hashFiles('apps/holtburger-cli/dist/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/release-cli-flatpak.json
          cache: true
      - name: Probe and record CLI Flatpak
        if: needs.plan.outputs.product != '3d'
        run: |
          flatpak install --user --noninteractive --assumeyes --reinstall .holtburger-local/holtburger-cli.flatpak
          chmod +x .holtburger-local/release-linux-probes/content_bootstrap
          dbus-run-session -- .github/flatpak/verify-cli-installed "$GITHUB_WORKSPACE/.holtburger-local/release-linux-probes/content_bootstrap"
          mkdir -p .holtburger-local/release-artifacts/cli
          BUNDLE='.holtburger-local/release-artifacts/cli/holtburger-cli-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp .holtburger-local/holtburger-cli.flatpak "$BUNDLE"
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-cli)
          npm run --silent release -- record-flatpak --files "$LOCATION/files" \
            --native "$HOLTBURGER_CLI_NATIVE" --bundle "$BUNDLE" \
            --output .holtburger-local/release-artifacts/cli/metadata-cli-flatpak.json
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.product != '3d'
        with:
          name: release-cli-flatpak
          path: .holtburger-local/release-artifacts/cli/*
          if-no-files-found: error
          compression-level: 0
      - name: Materialize 3D recipe from its native archive
        if: needs.plan.outputs.product != 'cli'
        run: |
          NATIVE=$(npm run --silent release -- prepare-flatpak --product 3d \
            --artifacts .holtburger-local/release-native-linux --output .holtburger-local/release-3d-flatpak.json)
          echo "HOLTBURGER_3D_NATIVE=$NATIVE" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        if: needs.plan.outputs.product != 'cli'
        with:
          bundle: .holtburger-local/holtburger-3d.flatpak
          build-dir: .holtburger-local/flatpak-3d-build
          repo-dir: .holtburger-local/flatpak-3d-repo
          state-dir: .holtburger-local/flatpak-3d-state
          cache-key: release-3d-${{ runner.arch }}-${{ hashFiles('.github/flatpak/**') }}
          upload-artifact: false
          manifest-path: .holtburger-local/release-3d-flatpak.json
          cache: true
      - name: Probe and record 3D Flatpak
        if: needs.plan.outputs.product != 'cli'
        run: |
          flatpak install --user --noninteractive --assumeyes --reinstall .holtburger-local/holtburger-3d.flatpak
          xvfb-run --auto-servernum dbus-run-session -- .github/flatpak/verify-installed
          mkdir -p .holtburger-local/release-artifacts/3d
          BUNDLE='.holtburger-local/release-artifacts/3d/holtburger-3d-${{ needs.plan.outputs.version }}-x86_64.flatpak'
          cp .holtburger-local/holtburger-3d.flatpak "$BUNDLE"
          LOCATION=$(flatpak --user info --show-location io.github.merklejerk.holtburger-3d)
          npm run --silent release -- record-flatpak --files "$LOCATION/files" \
            --native "$HOLTBURGER_3D_NATIVE" --bundle "$BUNDLE" \
            --output .holtburger-local/release-artifacts/3d/metadata-3d-flatpak.json
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.product != 'cli'
        with:
          name: release-3d-flatpak
          path: .holtburger-local/release-artifacts/3d/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, validation, linux, desktop, flatpak]
    if: needs.plan.outputs.skip != 'true' && needs.plan.outputs.tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    env:
      HOLTBURGER_SOURCE_REVISION: ${{ needs.plan.outputs.commit }}
      HOLTBURGER_DISTRIBUTION: ${{ needs.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        if: needs.plan.outputs.kind == 'nightly'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.plan.outputs.kind == 'nightly'
        with:
          cache-targets: false
          shared-key: release-versioning-registry
      - name: Validate and prepare distribution versions
        run: |
          if [ "$HOLTBURGER_DISTRIBUTION" = nightly ]; then cargo fetch --locked; fi
          npm run --silent release -- prepare-source --kind "$HOLTBURGER_DISTRIBUTION"
          echo 'HOLTBURGER_SOURCE_MODIFIED=0' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .holtburger-local/release-artifacts
          merge-multiple: true
      - name: Publish the complete verified distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: npm run --silent release -- publish .holtburger-local/release-artifacts "$RELEASE_TAG"
      # GITHUB_TOKEN publication does not emit another workflow-triggering release event.
      - name: Refresh the website and beta update feed
        if: needs.plan.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-updates.yml --repo "$GITHUB_REPOSITORY" --ref main
