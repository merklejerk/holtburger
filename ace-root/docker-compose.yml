services:

  ace-db:
    image: mysql:8.0
    container_name: ace-holtburger-db
    env_file:
      - docker.env
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306/tcp"
    restart: "no"
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
