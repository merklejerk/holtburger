[package]
name = "holtburger-3d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "holtburger-3d"

[features]
profile-devtools = ["tauri/devtools"]

[build-dependencies]
# Pinned to a revision rather than the branch: `feat/cef` is unmerged and rebases, and this is the
# app's only runtime, so a moving target would break the build without a local change.
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "f5bf953fe2a259f2d176491f50ec2930fb73e03d", features = [] }

[dependencies]
anyhow.workspace = true
holtburger-content.workspace = true
holtburger-common.workspace = true
holtburger-core.workspace = true
holtburger-dat.workspace = true
holtburger-protocol.workspace = true
holtburger-world.workspace = true
serde.workspace = true
serde_json.workspace = true
# `default-features = false` drops wry, which is otherwise pulled in by `default` and would compile
# a second runtime we never construct. `x11`/`dbus` are dropped with it: both only gate
# `tauri-runtime-wry`. `common-controls-v6` is kept because it also reaches `muda`, which we do use.
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "f5bf953fe2a259f2d176491f50ec2930fb73e03d", default-features = false, features = [
    "cef",
    "compression",
    "common-controls-v6",
    "dynamic-acl",
] }
tokio.workspace = true
geo = "0.33.1"
hex.workspace = true
log.workspace = true
holtburger-weenie-catalog.workspace = true
thiserror.workspace = true
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile.workspace = true
