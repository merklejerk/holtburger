<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- The 22-unit annulus matches Minimap's 5.5% inset. All strokes stop at
       radius 178, leaving the existing map aperture completely transparent.
       This circular assembly scales uniformly; it is not a nine-slice asset. -->
  <defs>
    <linearGradient id="iron-outer" x1="35" y1="10" x2="355" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69625d"/>
      <stop offset="0.22" stop-color="#3c3633"/>
      <stop offset="0.52" stop-color="#201b19"/>
      <stop offset="0.78" stop-color="#322b28"/>
      <stop offset="1" stop-color="#110d0c"/>
    </linearGradient>
    <linearGradient id="iron-lip" x1="70" y1="20" x2="325" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9c938c"/>
      <stop offset="0.3" stop-color="#5a514c"/>
      <stop offset="0.62" stop-color="#26201e"/>
      <stop offset="1" stop-color="#0e0b0a"/>
    </linearGradient>
    <linearGradient id="basalt" x1="50" y1="10" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27201e"/>
      <stop offset="0.48" stop-color="#191413"/>
      <stop offset="1" stop-color="#0e0b0a"/>
    </linearGradient>
    <linearGradient id="ember-rim" x1="20" y1="0" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffaa4d"/>
      <stop offset="0.45" stop-color="#f25e22"/>
      <stop offset="0.8" stop-color="#b53312"/>
      <stop offset="1" stop-color="#ff7e2e"/>
    </linearGradient>
    <pattern id="hammered" width="14" height="12" patternUnits="userSpaceOnUse">
      <path d="m1 3 3-1m4 4 3 1m-7 3 2-2" fill="none" stroke="#080605" stroke-opacity="0.45" stroke-width="0.85"/>
      <path d="m5 2 2 1m3 6 2-1" fill="none" stroke="#8f837a" stroke-opacity="0.16" stroke-width="0.7"/>
    </pattern>
  </defs>
  <g fill="none">
    <!-- Rolled blackened-iron outer lip: dark seat, forged crown, subtle specular crest. -->
    <circle cx="200" cy="200" r="198.5" stroke="#0b0807" stroke-width="3"/>
    <circle cx="200" cy="200" r="196" stroke="url(#iron-outer)" stroke-width="5.6"/>
    <circle cx="200" cy="200" r="198" stroke="url(#iron-lip)" stroke-width="1.1"/>
    <circle cx="200" cy="200" r="193.1" stroke="#110c0a" stroke-width="1.8"/>
    <!-- Recessed ember hairline seated beneath the outer iron rim. -->
    <circle cx="200" cy="200" r="191.9" stroke="url(#ember-rim)" stroke-opacity="0.58" stroke-width="1"/>
    <!-- Dark basalt forged channel between the outer and inner iron rings. -->
    <circle cx="200" cy="200" r="186.2" stroke="url(#basalt)" stroke-width="10.8"/>
    <circle cx="200" cy="200" r="186.2" stroke="url(#hammered)" stroke-width="10.8"/>
    <circle cx="200" cy="200" r="190.7" stroke="#ff8236" stroke-opacity="0.22" stroke-width="0.9"/>
    <circle cx="200" cy="200" r="181.4" stroke="#0a0706" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- Degree tick ring: 72 forged notches with no closing seam. -->
    <circle cx="200" cy="200" r="186.2" pathLength="360" stroke="#0c0807" stroke-width="5.2" stroke-dasharray="1.4 3.6"/>
    <circle cx="200" cy="200" r="186.2" pathLength="360" stroke="#7d6657" stroke-opacity="0.65" stroke-width="3.6" stroke-dasharray="1.1 3.9"/>
    <!-- Cardinal molten-ember seams at N, E, S, W within the channel. -->
    <path d="M200 9v9.5M381.5 200h9.5M200 381.5v9.5M9 200h9.5" stroke="#ff6e24" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Narrow inner iron retaining rim ending cleanly at the map aperture (r=178). -->
    <circle cx="200" cy="200" r="179.6" stroke="url(#iron-outer)" stroke-width="3.2"/>
    <circle cx="200" cy="200" r="180.7" stroke="#998272" stroke-opacity="0.55" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="178.4" stroke="#0d0908" stroke-width="0.8"/>
  </g>
</svg>
