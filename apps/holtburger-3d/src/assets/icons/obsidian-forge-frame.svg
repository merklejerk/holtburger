<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Nine-slice at 28 source pixels (rendered at 14px on panels, 10px on compact HUDs).
       The forged-iron rail occupies the outer ~10 units; the remaining corner area carries
       organic L-shaped smoldering ember fissures and heat falloff while straight edges stay slim. -->
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58524e"/>
      <stop offset="0.3" stop-color="#352f2c"/>
      <stop offset="0.7" stop-color="#1d1817"/>
      <stop offset="1" stop-color="#100d0c"/>
    </linearGradient>
    <!-- Soft organic heat bloom confined to each 28x28 corner region. -->
    <radialGradient id="heat-tl" cx="6" cy="6" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffaa33" stop-opacity="0.95"/>
      <stop offset="0.26" stop-color="#ff4d0a" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#b81b04" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7a0e00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat-tr" cx="90" cy="6" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffaa33" stop-opacity="0.95"/>
      <stop offset="0.26" stop-color="#ff4d0a" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#b81b04" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7a0e00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat-bl" cx="6" cy="90" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffaa33" stop-opacity="0.95"/>
      <stop offset="0.26" stop-color="#ff4d0a" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#b81b04" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7a0e00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat-br" cx="90" cy="90" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffaa33" stop-opacity="0.95"/>
      <stop offset="0.26" stop-color="#ff4d0a" stop-opacity="0.82"/>
      <stop offset="0.58" stop-color="#b81b04" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7a0e00" stop-opacity="0"/>
    </radialGradient>
    <!-- L-shaped corner mask so heat hugs the forged iron arms rather than forming a circle. -->
    <clipPath id="ember-corners">
      <path d="M1 1h26v10H11v16H1Z M69 1h26v26H85V11H69Z M1 69h10v16h16v10H1Z M85 69h10v26H69V85h16Z"/>
    </clipPath>
    <!-- Reusable molten fissure cluster for one corner; mirrored into all four. -->
    <g id="corner-fissure" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer molten orange glow along both arms of the corner -->
      <path d="M4.5 23.5V9.5Q4.5 4.5 9.5 4.5H23.5" stroke="#ff550d" stroke-width="4.4" stroke-opacity="0.65"/>
      <path d="M5.5 20V9Q5.5 5.5 9 5.5H20" stroke="#ff8826" stroke-width="2.4" stroke-opacity="0.92"/>
      <!-- White-hot incandescent ember core at the corner bend -->
      <path d="M5.5 14V8.5Q5.5 5.5 8.5 5.5H14" stroke="#fff0b3" stroke-width="1.35" stroke-opacity="0.98"/>
      <!-- Organic branching hairline cracks radiating from the hot corner -->
      <path d="M6.5 6.5 11.5 10.5M9.5 6.5 13 9M6.5 10.5 9.5 12.5" stroke="#ff6b1a" stroke-width="1.3" stroke-opacity="0.85"/>
      <path d="M6.2 6.2 9.2 8.8" stroke="#fff3c4" stroke-width="0.9" stroke-opacity="0.95"/>
      <!-- Tiny glowing ember flecks along the iron edge -->
      <circle cx="17.5" cy="5.5" r="0.95" fill="#ffd980" fill-opacity="0.9" stroke="none"/>
      <circle cx="5.5" cy="17.5" r="0.95" fill="#ffd980" fill-opacity="0.9" stroke="none"/>
      <circle cx="22.5" cy="5.8" r="0.7" fill="#ff741f" fill-opacity="0.85" stroke="none"/>
      <circle cx="5.8" cy="22.5" r="0.7" fill="#ff741f" fill-opacity="0.85" stroke="none"/>
    </g>
  </defs>
  <!-- Slim forged-iron rail along all four edges; interior stays transparent. -->
  <g fill="none">
    <rect x="1.5" y="1.5" width="93" height="93" rx="5" stroke="#0a0706" stroke-width="3"/>
    <rect x="3.2" y="3.2" width="89.6" height="89.6" rx="3.5" stroke="#59524d" stroke-width="1.6"/>
    <rect x="5.5" y="5.5" width="85" height="85" rx="2.2" stroke="url(#iron)" stroke-width="4.2"/>
    <rect x="7.8" y="7.8" width="80.4" height="80.4" rx="1.2" stroke="#856d5e" stroke-opacity="0.42" stroke-width="1"/>
    <rect x="9.4" y="9.4" width="77.2" height="77.2" rx="0.6" stroke="#0d0908" stroke-width="2"/>
    <rect x="10.8" y="10.8" width="74.4" height="74.4" stroke="#664c3d" stroke-opacity="0.8" stroke-width="1"/>
  </g>
  <!-- L-shaped smoldering ember heat confined strictly to the four 28x28 corners. -->
  <g clip-path="url(#ember-corners)">
    <rect x="0" y="0" width="28" height="28" fill="url(#heat-tl)"/>
    <rect x="68" y="0" width="28" height="28" fill="url(#heat-tr)"/>
    <rect x="0" y="68" width="28" height="28" fill="url(#heat-bl)"/>
    <rect x="68" y="68" width="28" height="28" fill="url(#heat-br)"/>
  </g>
  <!-- Glowing molten fissures and incandescent cores in all four corners. -->
  <use href="#corner-fissure"/>
  <use href="#corner-fissure" transform="translate(96 0) scale(-1 1)"/>
  <use href="#corner-fissure" transform="translate(0 96) scale(1 -1)"/>
  <use href="#corner-fissure" transform="translate(96 96) scale(-1 -1)"/>
</svg>
