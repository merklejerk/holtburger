<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32" viewBox="0 0 96 32">
  <!-- Deterministic periodic hammered-iron grain; CSS supplies the basalt-iron color. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.28 0.42" numOctaves="4" seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.14"/>
    </feComponentTransfer>
  </filter>
  <rect width="96" height="32" filter="url(#grain)"/>
</svg>
