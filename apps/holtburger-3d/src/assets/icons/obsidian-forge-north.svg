<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="-130 -130 260 260">
  <!-- Rotates with Minimap's compass around (0, 0). Crisp vector forged-iron spearhead
       and swept ember-inlaid wings framing the live HiDPI North glyph at r=100. -->
  <defs>
    <radialGradient id="north-ember-halo" cx="0" cy="-102" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8c24" stop-opacity="0.48"/>
      <stop offset="0.45" stop-color="#d92b04" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a0a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forge-blade" x1="0" y1="-124" x2="0" y2="-92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b5e58"/>
      <stop offset="0.4" stop-color="#302825"/>
      <stop offset="1" stop-color="#120d0c"/>
    </linearGradient>
    <linearGradient id="ember-inlay" x1="0" y1="-123" x2="0" y2="-92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4bf"/>
      <stop offset="0.4" stop-color="#ff7a1f"/>
      <stop offset="1" stop-color="#8c1c06"/>
    </linearGradient>
  </defs>
  <!-- Subtle warm heat halo behind the North crest. -->
  <circle cx="0" cy="-102" r="22" fill="url(#north-ember-halo)"/>
  <g transform="translate(0 -100)">
    <!-- Ornate forged-iron spearhead crown above N with hot-to-cool molten core. -->
    <path fill="url(#forge-blade)" stroke="#0d0705" stroke-width="1.4" stroke-linejoin="miter" d="M 0 -24 L 4.6 -15 L 0 -11.5 L -4.6 -15 Z"/>
    <path fill="url(#ember-inlay)" d="M 0 -21.2 L 2 -15.2 L 0 -13.1 L -2 -15.2 Z"/>
    <!-- Swept ornate wrought-iron & ember filigree wings flanking N. -->
    <g>
      <path fill="url(#forge-blade)" stroke="#0d0705" stroke-width="1.2" stroke-linejoin="round" d="M 10.5 4.8 Q 16.5 1.8 24 -2.2 L 26 0.6 Q 19 4.8 11.5 7.4 Z"/>
      <path fill="none" stroke="url(#ember-inlay)" stroke-width="1.2" stroke-linecap="round" d="M 12 5.4 Q 17.5 2.8 23.8 -0.6"/>
      <path fill="none" stroke="#6b5e58" stroke-width="1.1" stroke-linecap="round" d="M 12.5 8.2 Q 17.5 6.8 22 4.6"/>
    </g>
    <g transform="scale(-1 1)">
      <path fill="url(#forge-blade)" stroke="#0d0705" stroke-width="1.2" stroke-linejoin="round" d="M 10.5 4.8 Q 16.5 1.8 24 -2.2 L 26 0.6 Q 19 4.8 11.5 7.4 Z"/>
      <path fill="none" stroke="url(#ember-inlay)" stroke-width="1.2" stroke-linecap="round" d="M 12 5.4 Q 17.5 2.8 23.8 -0.6"/>
      <path fill="none" stroke="#6b5e58" stroke-width="1.1" stroke-linecap="round" d="M 12.5 8.2 Q 17.5 6.8 22 4.6"/>
    </g>
  </g>
</svg>
