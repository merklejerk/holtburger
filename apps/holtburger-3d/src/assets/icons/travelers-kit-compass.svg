<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- The 22-unit annulus matches Minimap's 5.5% inset. All strokes stop at
       radius 178, leaving the existing map aperture completely transparent.
       This circular assembly scales uniformly; it is not a nine-slice asset. -->
  <defs>
    <linearGradient id="copper" x1="35" y1="10" x2="350" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe1ae"/>
      <stop offset="0.22" stop-color="#c79564"/>
      <stop offset="0.48" stop-color="#805033"/>
      <stop offset="0.74" stop-color="#a16b43"/>
      <stop offset="1" stop-color="#382015"/>
    </linearGradient>
    <linearGradient id="lip" x1="70" y1="20" x2="325" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0cd"/>
      <stop offset="0.3" stop-color="#d7a675"/>
      <stop offset="0.58" stop-color="#71452c"/>
      <stop offset="1" stop-color="#24140d"/>
    </linearGradient>
    <linearGradient id="leather" x1="50" y1="10" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#653c2d"/>
      <stop offset="0.45" stop-color="#45271e"/>
      <stop offset="1" stop-color="#291811"/>
    </linearGradient>
    <pattern id="grain" width="13" height="11" patternUnits="userSpaceOnUse">
      <path d="m1 2 2-1m5 5 3 1m-8 3 1-2" fill="none" stroke="#190e09" stroke-opacity="0.4" stroke-width="0.8"/>
      <path d="m5 3 2 1m3 5 2-1" fill="none" stroke="#c08761" stroke-opacity="0.18" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="thread" x1="20" y1="0" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2d4a2"/>
      <stop offset="0.5" stop-color="#d3a16c"/>
      <stop offset="1" stop-color="#a27549"/>
    </linearGradient>
  </defs>
  <g fill="none">
    <!-- Rolled outer lip: dark seat, domed copper, bright crest and undercut. -->
    <circle cx="200" cy="200" r="198.5" stroke="#21130c" stroke-width="3"/>
    <circle cx="200" cy="200" r="196" stroke="url(#copper)" stroke-width="5.6"/>
    <circle cx="200" cy="200" r="198" stroke="url(#lip)" stroke-width="1.2"/>
    <circle cx="200" cy="200" r="193.1" stroke="#29170f" stroke-width="1.8"/>
    <circle cx="200" cy="200" r="191.9" stroke="#b68457" stroke-opacity="0.65" stroke-width="0.8"/>
    <!-- Stitched leather is seated between the two metal retaining edges. -->
    <circle cx="200" cy="200" r="186.2" stroke="url(#leather)" stroke-width="10.8"/>
    <circle cx="200" cy="200" r="186.2" stroke="url(#grain)" stroke-width="10.8"/>
    <circle cx="200" cy="200" r="190.7" stroke="#dba77c" stroke-opacity="0.25" stroke-width="0.9"/>
    <circle cx="200" cy="200" r="181.4" stroke="#160c08" stroke-opacity="0.8" stroke-width="1.2"/>
    <!-- Normalizing the path to 360 gives exactly 100 stitches with no closing seam. -->
    <circle cx="200" cy="200.6" r="186.2" pathLength="360" stroke="#190d08" stroke-width="4.2" stroke-dasharray="1.8 1.8"/>
    <circle cx="200" cy="200" r="186.2" pathLength="360" stroke="url(#thread)" stroke-width="2.8" stroke-dasharray="1.8 1.8"/>
    <!-- Narrow inner retaining rim ends exactly at the map aperture. -->
    <circle cx="200" cy="200" r="179.6" stroke="url(#copper)" stroke-width="3.2"/>
    <circle cx="200" cy="200" r="180.7" stroke="#edc797" stroke-opacity="0.7" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="178.4" stroke="#29170f" stroke-width="0.8"/>
  </g>
</svg>
