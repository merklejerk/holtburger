<svg xmlns="http://www.w3.org/2000/svg" width="96" height="32" viewBox="0 0 96 32">
  <!-- A deterministic periodic grain; the CSS header supplies its material color. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.375 0.5" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.12"/>
    </feComponentTransfer>
  </filter>
  <rect width="96" height="32" filter="url(#grain)"/>
</svg>
