[package]
name = "holtburger-tools"
version = "0.1.0"
edition = "2024"
authors = ["holtburger contributors"]
default-run = "dat2hba"

[features]
weenie-catalog-export = ["dep:mysql"]

[[bin]]
name = "export-weenie-catalog"
path = "src/bin/export-weenie-catalog.rs"
required-features = ["weenie-catalog-export"]

[dependencies]
holtburger-common = { workspace = true }
holtburger-content = { path = "../../crates/holtburger-content" }
holtburger-dat = { path = "../../crates/holtburger-dat" }
holtburger-weenie-catalog = { workspace = true }
anyhow = { workspace = true }
binrw = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
indicatif = { workspace = true } # Progress bars for the win
rayon = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
zip.workspace = true
regex.workspace = true
mysql = { version = "28.0.0", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
