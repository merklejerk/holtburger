<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Nine-slice at 16 source pixels. Smooth edges stretch; the center stays empty.
       Nested metal profiles meet at every cut without periodic texture seams. -->
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e3b786"/>
      <stop offset="0.25" stop-color="#ba8659"/>
      <stop offset="0.65" stop-color="#795033"/>
      <stop offset="1" stop-color="#43291b"/>
    </linearGradient>
    <linearGradient id="stud" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#f2cea0"/>
      <stop offset="0.45" stop-color="#b47d4f"/>
      <stop offset="1" stop-color="#4a2d1c"/>
    </linearGradient>
  </defs>
  <g fill="none">
    <rect x="1.5" y="1.5" width="61" height="61" rx="5" stroke="#1b100b" stroke-width="3"/>
    <rect x="3" y="3" width="58" height="58" rx="3.5" stroke="#b58359" stroke-width="2"/>
    <rect x="5.5" y="5.5" width="53" height="53" rx="2" stroke="url(#copper)" stroke-width="4"/>
    <rect x="7.5" y="7.5" width="49" height="49" rx="1" stroke="#efc49a" stroke-opacity="0.55"/>
    <rect x="9" y="9" width="46" height="46" rx="0.5" stroke="#28160e" stroke-width="2"/>
    <rect x="10.5" y="10.5" width="43" height="43" stroke="#ad794d"/>
    <!-- Corner straps bridge the otherwise straight moulding. -->
    <path d="M3 14V5a2 2 0 0 1 2-2h9M50 3h9a2 2 0 0 1 2 2v9M61 50v9a2 2 0 0 1-2 2h-9M14 61H5a2 2 0 0 1-2-2v-9" stroke="#e0ae79" stroke-width="1.5"/>
  </g>
  <!-- Dark seats separate the larger nailheads from the copper moulding. -->
  <g fill="#24140d" stroke="#e0ae79" stroke-width="0.5">
    <circle cx="7" cy="7" r="5.25"/>
    <circle cx="57" cy="7" r="5.25"/>
    <circle cx="7" cy="57" r="5.25"/>
    <circle cx="57" cy="57" r="5.25"/>
  </g>
  <g fill="url(#stud)" stroke="#352014" stroke-width="0.75">
    <circle cx="7" cy="7" r="4.5"/>
    <circle cx="57" cy="7" r="4.5"/>
    <circle cx="7" cy="57" r="4.5"/>
    <circle cx="57" cy="57" r="4.5"/>
  </g>
  <g fill="#ffe0b6" fill-opacity="0.85">
    <circle cx="5.75" cy="5.75" r="1.1"/>
    <circle cx="55.75" cy="5.75" r="1.1"/>
    <circle cx="5.75" cy="55.75" r="1.1"/>
    <circle cx="55.75" cy="55.75" r="1.1"/>
  </g>
</svg>
